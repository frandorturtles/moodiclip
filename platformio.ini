; ============================================================================
;  Digital Mood Hair Clip — LilyGO T-Display (ESP32, ST7789V 135x240)
;
;  Compilar y subir:   pio run -t upload
;  Monitor serie:      pio device monitor
;
;  Pines de pantalla verificados con la documentación oficial de LilyGO
;  (wiki.lilygo.cc y repo Xinyuan-LilyGO/TTGO-T-Display):
;    MOSI=19  SCLK=18  CS=5  DC=16  RST=23  BL=4  (MISO no se usa)
; ============================================================================

[env:lilygo-t-display]
; Versión fija de la plataforma = núcleo Arduino-ESP32 2.0.x (API ledcSetup/ledcAttachPin).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; 80 MHz es de sobra para esta animación y gasta menos batería que 240 MHz.
board_build.f_cpu = 80000000L

; Partición con ~3 MB para el programa (caben unas 30-40 imágenes 240x135).
; La T-Display trae 4 MB (o 16 MB) de flash, así que cabe sin problema.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@2.5.43

build_flags =
    ; (Las imágenes convertidas se incluyen desde include/config.h con una ruta relativa.)
    -DCORE_DEBUG_LEVEL=0

    ; --- TFT_eSPI: configuración de la T-Display (equivale a Setup25_TTGO_T_Display) ---
    ; Con USER_SETUP_LOADED=1 no hace falta editar archivos dentro de la librería.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    ; (El backlight en GPIO4 lo controla el firmware con PWM, ver config.h)
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
